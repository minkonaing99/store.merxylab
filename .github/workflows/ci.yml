name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # No database is reachable in CI and every DB-backed page is
        # force-dynamic, so a syntactically valid dummy URL is enough for the
        # build to compile. AUTH_SECRET only needs to exist.
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          AUTH_SECRET: ci-build-secret-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
